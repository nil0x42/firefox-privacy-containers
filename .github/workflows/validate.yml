name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  firefox:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        firefox: ["142.0", "latest"]
    name: Firefox ${{ matrix.firefox }} integration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: ${{ matrix.firefox }}
      - run: npm run test:firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
